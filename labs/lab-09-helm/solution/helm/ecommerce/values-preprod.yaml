# Surcharge PREPROD : plus de réplicas, plus de ressources, autoscaling, hôte dédié.
# Helm fusionne en profondeur avec values.yaml : on n'écrit que ce qui change.
resources:
  requests: { cpu: 250m, memory: 256Mi }
  limits:   { cpu: "1",  memory: 512Mi }
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 60
ingress:
  host: ecommerce-preprod.localhost
services:
  gateway:
    replicas: 2
  web:
    replicas: 2
